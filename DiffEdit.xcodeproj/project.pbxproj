			name = "Build Tauri app";
			outputPaths = (
				"$(DERIVED_FILE_DIR)/DiffEdit-Info.plist",
				"$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -euo pipefail\n\n# Xcode launched from Finder does not inherit an interactive shell's PATH.\nexport PATH=\"${HOME}/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:${PATH}\"\ncd \"${SRCROOT:?Run this script from the DiffEdit Xcode target.}\"\n\nfor tool in node npm cargo; do\n  if ! command -v \"$tool\" >/dev/null 2>&1; then\n    echo \"error: $tool is missing. Install the Node.js and Rust prerequisites from README.md.\"\n    exit 1\n  fi\ndone\nif [[ ! -x node_modules/.bin/tauri ]]; then\n  echo \"error: Dependencies are missing. Run npm ci in $SRCROOT, then build again.\"\n  exit 1\nfi\n\n# Keep generated Rust output in DerivedData, away from the source tree.\nexport CARGO_TARGET_DIR=\"${CARGO_TARGET_DIR:-${PROJECT_TEMP_DIR}/cargo}\"\nworkspace=\"${PROJECT_TEMP_DIR}/tauri-workspace\"\nflags=(build --bundles app --no-sign --ci --config '{\"build\":{\"beforeBuildCommand\":null}}')\ncase \"${CONFIGURATION}\" in\n  Debug) profile=debug; flags+=(--debug) ;;\n  Release) profile=release ;;\n  *) echo \"error: Unsupported configuration: ${CONFIGURATION}\"; exit 1 ;;\nesac\n\n# The regular Tauri build embeds the frontend and produces the canonical bundle\n# metadata. Xcode owns the final product's signing and launch/debug lifecycle.\nnpm run build\n# Tauri regenerates ACL schemas beside Cargo.toml. Use a source copy so cloud\n# file-provider permissions cannot block generation inside the checkout.\nmkdir -p \"$workspace/backend\" \"$workspace/dist\"\n/usr/bin/rsync -a --delete --exclude='/target' --exclude='/gen' \\\n  \"$SRCROOT/backend/\" \"$workspace/backend/\"\n/usr/bin/rsync -a --delete \"$SRCROOT/dist/\" \"$workspace/dist/\"\ncd \"$workspace\"\nexport TAURI_APP_PATH=\"$workspace/backend\"\nexport TAURI_FRONTEND_PATH=\"$SRCROOT\"\n\"$SRCROOT/node_modules/.bin/tauri\" \"${flags[@]}\"\nbundle=\"${CARGO_TARGET_DIR}/${profile}/bundle/macos/DiffEdit.app\"\nif [[ ! -x \"$bundle/Contents/MacOS/diffedit\" ]]; then\n  echo \"error: Tauri did not produce the expected app at $bundle\"\n  exit 1\nfi\nmkdir -p \"${DERIVED_FILE_DIR}\" \"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}\"\ncp \"$bundle/Contents/Info.plist\" \"${DERIVED_FILE_DIR}/DiffEdit-Info.plist\"\n# ProcessInfoPlistFile consumes the generated plist; CodeSign creates the final\n# signature. Preserve all other Tauri resources, including future bundle assets.\n/usr/bin/rsync -a --delete --exclude='/Info.plist' --exclude='/_CodeSignature' \\\n  \"$bundle/Contents/\" \"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/\"\n";
		};
